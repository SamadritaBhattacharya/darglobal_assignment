[project]
name = "dar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "pydantic", "rank-bm25"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests", "../scraper/tests", "../evals/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
